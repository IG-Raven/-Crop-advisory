<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>{% block title %}CropAdvisory Nepal{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; }
    body { background: #F9FAFB; font-family: -apple-system, Segoe UI, Roboto, sans-serif; }

    .site-nav.nav-transparent {
     background: rgba(255, 255, 255, 0.12) !important;
     backdrop-filter: blur(10px);
     -webkit-backdrop-filter: blur(10px);
     box-shadow: none !important;
     border-bottom: 1px solid rgba(255,255,255,0.2);
    }

    .site-nav .navbar-brand {
      color: white !important;
      font-weight: 700;
      font-size: 20px;
    }

    .site-nav .nav-link {
      color: white !important;
      font-weight: 500;
      padding: 6px 14px !important;
    }

    .site-nav .nav-link:hover { 
      color: #1B4332 !important; 
    }

    .lang-group {
      display: flex;
      align-items: center;
      background: rgba(255,255,255,0.2);
      border-radius: 8px;
      padding: 3px;
      margin-right: 20px;
    }

    .lang-btn {
      background: transparent;
      color: white;
      border: none;
      padding: 5px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }

    .lang-btn.active {
      background: white;
      color: #0EA5E9;
      font-weight: 600;
    }

    .lang-btn:hover { 
      color: #1B4332; 
    }

    .btn-login-nav {
      color: white !important;
      font-weight: 500;
      text-decoration: none;
      margin-right: 12px;
      padding: 6px 4px;
    }
    .btn-login-nav:hover { color: #1B4332 !important; }

    .btn-signup-nav {
      background: white;
      color: #0EA5E9 !important;
      border-radius: 6px;
      padding: 7px 20px;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.15s;
    }

    .btn-signup-nav:hover { 
      background: #E0F2FE; 
    }

    .site-nav.nav-dashboard {
  background: linear-gradient(135deg, #1565C0, #1E88E5) !important;
  box-shadow: 0 2px 12px rgba(0,0,0,0.15) !important;
  }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg site-nav fixed-top {% block nav_class %}{% endblock %}">
  <div class="container-fluid px-4">

    <a class="navbar-brand" href="/">CropAdvisory Nepal</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navMenu" style="border-color:white;">
      <span class="navbar-toggler-icon"></span>
    </button>

  <div class="collapse navbar-collapse" id="navMenu">
  <ul class="navbar-nav mx-auto">
    {% block nav_links %}
    <li class="nav-item"><a href="/" class="nav-link">Home</a></li>
    <li class="nav-item"><a href="/dashboard/" class="nav-link">Dashboard</a></li>
    <li class="nav-item"><a href="/about/" class="nav-link">About</a></li>
    {% endblock %}
  </ul>

  <div class="d-flex align-items-center">
    {% block nav_right %}
    <div class="lang-group">
      <button class="lang-btn active">English</button>
      <button class="lang-btn">नेपाली</button>
    </div>
    <a href="/login/" class="btn-login-nav">Login</a>
    <a href="/register/" class="btn-signup-nav">Sign up</a>
    {% endblock %}
  </div>
</div>

  </div>
</nav>

<div class="container-fluid px-0">
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
