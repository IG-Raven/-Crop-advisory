{% extends "advisory/base.html" %}
{% block content %}
<div class="text-center" style="padding:100px 20px;">
  <h3 style="color:#EF4444;">Something Went Wrong</h3>
  <p class="text-muted">{{ error_message|default:"We couldn't process your request. Please try again." }}</p>
  <a href="/" class="btn mt-3" style="background:#1B4332;color:white;">Try Again</a>
</div>
{% endblock %}
